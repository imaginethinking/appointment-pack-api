spring.application.name=appointment-pack-api

# Postgres DB Properties
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway / JPA Properties
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
spring.flyway.default-schema=public
spring.flyway.schemas=public

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Properties
app.jwt.secret=${JWT_SECRET}

# Enable Problem Details ErrorResponse
spring.mvc.problemdetails.enabled=true

# Frontend / CORS Properties
appointment-pack.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:4200}
appointment-pack.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Email Properties
appointment-pack.email.from=${MAIL_FROM:no-reply@appointment-pack.local}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Document Storage Properties
appointment-pack.documents.storage-directory=${DOCUMENT_STORAGE_DIRECTORY:./data/documents}
appointment-pack.documents.maximum-file-size-bytes=10485760

# Generated Appointment Pack Storage
appointment-pack.appointment-packs.storage-directory=${APPOINTMENT_PACK_STORAGE_DIRECTORY:./data/appointment-packs}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Document Processing Service Properties
appointment-pack.document-processing.base-url=${DOCUMENT_PROCESSING_BASE_URL:http://127.0.0.1:8000}
appointment-pack.document-processing.api-key=${DOCUMENT_PROCESSING_API_KEY}
appointment-pack.document-processing.connect-timeout-seconds=5
appointment-pack.document-processing.response-timeout-seconds=120
appointment-pack.document-processing.lifecycle.stale-after=${DOCUMENT_PROCESSING_STALE_AFTER:PT5M}
appointment-pack.document-processing.lifecycle.recovery-interval-ms=${DOCUMENT_PROCESSING_RECOVERY_INTERVAL_MS:60000}