spring.application.name=appointment-pack-api

# Postgres DB Properties
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Properties
app.jwt.secret=${JWT_SECRET}

# Enable Problem Details ErrorResponse
spring.mvc.problemdetails.enabled=true

# File Storage Properties
appointment-pack.documents.storage-directory=${DOCUMENT_STORAGE_DIRECTORY:./data/documents}
appointment-pack.documents.maximum-file-size-bytes=10485760

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB