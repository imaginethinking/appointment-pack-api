# Dedicated PostgreSQL database used only by Spring integration tests.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/appointment_pack_test}
spring.datasource.username=${TEST_DB_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD:postgres}}

# Flyway remains responsible for the integration-test schema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.schemas=public

# Hibernate validates the Flyway-created test schema only.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Deterministic non-production secrets/configuration for the test context.
app.jwt.secret=appointment-pack-integration-test-jwt-secret-1234567890
appointment-pack.document-processing.api-key=test-document-processing-api-key

# Keep any future test-created files isolated from development data.
appointment-pack.documents.storage-directory=./target/test-data/documents
appointment-pack.appointment-packs.storage-directory=./target/test-data/appointment-packs

# Email delivery is not integration-tested. Transactional tests roll back before
# after-commit notification listeners execute.
spring.mail.host=localhost
spring.mail.port=1025